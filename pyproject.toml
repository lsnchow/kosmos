[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumb-worldeval"
version = "0.1.0"
description = "Auditable world-model policy evaluation and measurement console"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pillow>=10,<13", "pyflakes>=3.2,<4"]
analytics = ["scipy>=1.10,<2"]
media = ["pillow>=10,<13", "imageio>=2.34,<3", "imageio-ffmpeg>=0.5,<1"]

[project.scripts]
plumb = "plumb.cli:main"

[tool.setuptools.packages.find]
include = ["plumb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
