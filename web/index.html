<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Nightshift — Measurement Console</title>
    <meta
      name="description"
      content="Roll a robot policy out inside a generative world model, score it with a validated judge, and get four numbers saying how far to trust the ranking."
    />
    <!--
      Self-hosted fonts, preloaded. Never a CDN: this console runs on stage and
      has to render identically with no network at all.
    -->
    <!--
      Two faces now, not five. Every surface is set in Geist Mono, and Bitcount
      Grid Double draws the headings on both the landing and the console, so
      both are first-screen on every route. Geist Sans and Instrument Serif are
      no longer referenced by any token or class; preloading either would be
      fetching a font nothing asks for.
    -->
    <link rel="preload" href="/fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BitcountGridDouble-vf.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
