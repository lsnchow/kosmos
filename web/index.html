<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Kosmos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Generate robot rollouts in a world model and inspect model assessments and inference telemetry."
    />
    <!--
      Self-hosted fonts, preloaded. Never a CDN: this console runs on stage and
      has to render identically with no network at all.
    -->
    <!--
      Three faces. Geist Mono sets every console surface and every label on the
      landing; Bitcount Grid Double draws the console's headings and the
      landing's wordmark and footer display.

      Geist Sans is third and is landing-only: `.kosmos-landing` redeclares
      `--font-sans` to reach it, so it carries the hero headline and the pillar
      headings. It is preloaded because that headline is the first-screen text
      on `/` — the one string on the site that has to be legible immediately.
      Instrument Serif stays unreferenced and unpreloaded.
    -->
    <link rel="preload" href="/fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BitcountGridDouble-vf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
